<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="55" ry="50" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="45" fill="#F4A460"/>

  <!-- Left ear -->
  <polygon points="65,50 50,15 85,45" fill="#F4A460"/>
  <polygon points="68,48 56,22 82,44" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="135,50 150,15 115,45" fill="#F4A460"/>
  <polygon points="132,48 144,22 118,44" fill="#FFB6C1"/>

  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="83" cy="80" rx="9" ry="10" fill="white"/>
  <ellipse cx="117" cy="80" rx="9" ry="10" fill="white"/>
  <circle cx="85" cy="81" r="6" fill="#2D2D2D"/>
  <circle cx="119" cy="81" r="6" fill="#2D2D2D"/>
  <circle cx="87" cy="79" r="2" fill="white"/>
  <circle cx="121" cy="79" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,95 96,101 104,101" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 96 101 Q 100 107 104 101" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 96 101 Q 90 106 86 103" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M 104 101 Q 110 106 114 103" stroke="#8B4513" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="55" y1="97" x2="90" y2="100" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="55" y1="103" x2="90" y2="103" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="58" y1="109" x2="90" y2="106" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Whiskers right -->
  <line x1="145" y1="97" x2="110" y2="100" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="145" y1="103" x2="110" y2="103" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="142" y1="109" x2="110" y2="106" stroke="#8B4513" stroke-width="1.5"/>

  <!-- Left arm -->
  <ellipse cx="52" cy="155" rx="18" ry="12" fill="#F4A460" transform="rotate(-30, 52, 155)"/>

  <!-- Right arm -->
  <ellipse cx="148" cy="155" rx="18" ry="12" fill="#F4A460" transform="rotate(30, 148, 155)"/>

  <!-- Left paw -->
  <ellipse cx="42" cy="165" rx="12" ry="9" fill="#F4A460"/>
  <circle cx="36" cy="168" r="4" fill="#F4A460"/>
  <circle cx="42" cy="170" r="4" fill="#F4A460"/>
  <circle cx="48" cy="168" r="4" fill="#F4A460"/>

  <!-- Right paw -->
  <ellipse cx="158" cy="165" rx="12" ry="9" fill="#F4A460"/>
  <circle cx="152" cy="168" r="4" fill="#F4A460"/>
  <circle cx="158" cy="170" r="4" fill="#F4A460"/>
  <circle cx="164" cy="168" r="4" fill="#F4A460"/>

  <!-- Legs -->
  <ellipse cx="80" cy="195" rx="16" ry="12" fill="#F4A460"/>
  <ellipse cx="120" cy="195" rx="16" ry="12" fill="#F4A460"/>

  <!-- Feet -->
  <ellipse cx="78" cy="205" rx="18" ry="8" fill="#F4A460"/>
  <ellipse cx="122" cy="205" rx="18" ry="8" fill="#F4A460"/>

  <!-- Tail -->
  <path d="M 150 175 Q 185 160 180 140 Q 175 120 160 130" stroke="#F4A460" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Belly pattern -->
  <ellipse cx="100" cy="155" rx="28" ry="30" fill="#FFDAB9" opacity="0.6"/>

  <!-- Blush marks -->
  <ellipse cx="72" cy="95" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="128" cy="95" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
</svg>
